<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Creator OS</title>
    <style>
      :root {
        --bg: #fff;
        --bg2: #f7f6f3;
        --bg3: #efeee9;
        --tx: #37352f;
        --tx2: #787774;
        --bd: #e3e2de;
        --ac: #2f6fed;
        --ac2: #e8f0fe;
        --ok: #2e7d5b;
        --ok2: #e4f3ec;
        --warn: #b26b00;
        --warn2: #fdf1dc;
        --bad: #c4423a;
        --bad2: #fbe7e5;
        --r: 8px;
        --sh: 0 1px 2px rgba(0, 0, 0, 0.07);
      }
      [data-theme="dark"] {
        --bg: #191919;
        --bg2: #202020;
        --bg3: #2b2b2b;
        --tx: #e6e6e4;
        --tx2: #9b9a97;
        --bd: #383838;
        --ac: #6ea0ff;
        --ac2: #1f2f4d;
        --ok: #5fc596;
        --ok2: #17332a;
        --warn: #e8aa4a;
        --warn2: #3a2c12;
        --bad: #ef7d75;
        --bad2: #3c1f1d;
        --sh: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font:
          15px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--tx);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .side {
        width: 256px;
        flex: none;
        background: var(--bg2);
        border-right: 1px solid var(--bd);
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        transition: margin 0.2s;
        padding: 14px 10px;
      }
      .side.col {
        margin-left: -256px;
      }
      .brand {
        font-weight: 700;
        font-size: 16px;
        padding: 6px 10px 14px;
      }
      .brand small {
        display: block;
        font-weight: 400;
        color: var(--tx2);
        font-size: 12px;
      }
      .nav a {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 7px 10px;
        border-radius: 6px;
        color: var(--tx);
        text-decoration: none;
        cursor: pointer;
        font-size: 14px;
      }
      .nav a:hover {
        background: var(--bg3);
      }
      .nav a.on {
        background: var(--ac2);
        color: var(--ac);
        font-weight: 600;
      }
      .nav a span.n {
        opacity: 0.7;
        width: 20px;
        text-align: center;
      }
      .side .note {
        font-size: 12px;
        color: var(--tx2);
        padding: 12px 10px;
      }
      .mainwrap {
        flex: 1;
        min-width: 0;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--bd);
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 20px;
      }
      .top .sr {
        position: relative;
        flex: 1;
        max-width: 460px;
      }
      .top input[type="search"] {
        width: 100%;
      }
      #sres {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        max-height: 340px;
        overflow: auto;
        display: none;
      }
      #sres a {
        display: block;
        padding: 8px 12px;
        cursor: pointer;
        border-bottom: 1px solid var(--bd);
        font-size: 14px;
      }
      #sres a:hover {
        background: var(--bg2);
      }
      #saved {
        font-size: 12px;
        color: var(--tx2);
        margin-left: auto;
        white-space: nowrap;
      }
      main {
        padding: 24px 28px 80px;
        max-width: 1240px;
        margin: 0 auto;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 4px;
        letter-spacing: -0.4px;
      }
      h2 {
        font-size: 20px;
        margin: 26px 0 10px;
      }
      h3 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--tx2);
        margin: 0 0 12px;
        font-size: 14px;
      }
      .card {
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 16px 18px;
        margin: 14px 0;
        box-shadow: var(--sh);
      }
      .card.tint {
        background: var(--bg2);
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .g4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .g6 {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .fld.span {
        grid-column: 1/-1;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--tx2);
      }
      input,
      select,
      textarea {
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 7px 9px;
        width: 100%;
        min-width: 0;
      }
      textarea {
        resize: vertical;
        line-height: 1.45;
      }
      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 1px;
      }
      input[type="checkbox"] {
        width: auto;
      }
      .help {
        font-size: 12px;
        color: var(--tx2);
      }
      .btn {
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 14px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .btn:hover {
        background: var(--bg3);
      }
      .btn.pri {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .btn.pri:hover {
        filter: brightness(1.1);
      }
      .btn.dng {
        color: var(--bad);
        border-color: var(--bad);
      }
      .btn.sm {
        padding: 3px 8px;
        font-size: 12px;
      }
      .icon {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--tx2);
        padding: 4px 8px;
        border-radius: 4px;
      }
      .icon:hover {
        background: var(--bad2);
        color: var(--bad);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .sp {
        flex: 1;
      }
      .stat {
        background: var(--bg2);
        border-radius: var(--r);
        padding: 12px 14px;
        cursor: default;
      }
      .stat b {
        display: block;
        font-size: 26px;
        line-height: 1.1;
      }
      .stat span {
        font-size: 12px;
        color: var(--tx2);
      }
      .badge {
        display: inline-block;
        border-radius: 4px;
        padding: 1px 8px;
        font-size: 12px;
        background: var(--bg3);
        color: var(--tx2);
        white-space: nowrap;
      }
      .badge[data-s="Idea"] {
        background: #eee;
        color: #666;
      }
      .badge[data-s="Research"] {
        background: #e1ecf9;
        color: #1d5aa6;
      }
      .badge[data-s="Ready to Film"] {
        background: #e6f4ea;
        color: #1e7a43;
      }
      .badge[data-s="In Production"] {
        background: #fdeacc;
        color: #a15c00;
      }
      .badge[data-s="Editing"] {
        background: #f3e5f9;
        color: #7a2b95;
      }
      .badge[data-s="Published"] {
        background: #d8f1f5;
        color: #0b6b7a;
      }
      .badge[data-s="Analyzed"] {
        background: #dcf5d8;
        color: #2a7a1d;
      }
      .badge.ok {
        background: var(--ok2);
        color: var(--ok);
      }
      .badge.warn {
        background: var(--warn2);
        color: var(--warn);
      }
      .badge.bad {
        background: var(--bad2);
        color: var(--bad);
      }
      .badge.ac {
        background: var(--ac2);
        color: var(--ac);
      }
      .bar {
        height: 6px;
        background: var(--bg3);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ac);
        border-radius: 3px;
        transition: width 0.3s;
      }
      .tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        border-bottom: 1px solid var(--bd);
        margin: 14px 0 4px;
        position: sticky;
        top: 53px;
        background: var(--bg);
        z-index: 10;
      }
      .tabs button {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 9px 12px;
        cursor: pointer;
        color: var(--tx2);
        white-space: nowrap;
        font-size: 14px;
      }
      .tabs button.on {
        color: var(--ac);
        border-bottom-color: var(--ac);
        font-weight: 600;
      }
      .tw {
        overflow-x: auto;
        border: 1px solid var(--bd);
        border-radius: var(--r);
        margin: 8px 0;
      }
      table.t {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      table.t th {
        background: var(--bg2);
        text-align: left;
        padding: 7px 8px;
        font-size: 12px;
        color: var(--tx2);
        white-space: nowrap;
        position: sticky;
        top: 0;
      }
      table.t td {
        padding: 4px;
        border-top: 1px solid var(--bd);
        vertical-align: top;
      }
      table.t td input,
      table.t td select,
      table.t td textarea {
        font-size: 13px;
        padding: 5px 6px;
      }
      table.plain td {
        padding: 7px 8px;
        vertical-align: middle;
      }
      details.c {
        border: 1px solid var(--bd);
        border-radius: var(--r);
        margin: 8px 0;
        background: var(--bg);
      }
      details.c > summary {
        padding: 10px 14px;
        cursor: pointer;
        display: flex;
        gap: 10px;
        align-items: center;
        list-style: none;
        font-weight: 600;
      }
      details.c > summary::-webkit-details-marker {
        display: none;
      }
      details.c > summary::before {
        content: "▸";
        color: var(--tx2);
        transition: transform 0.15s;
      }
      details.c[open] > summary::before {
        transform: rotate(90deg);
      }
      details.c > .body {
        padding: 6px 14px 14px;
        border-top: 1px solid var(--bd);
      }
      .empty {
        padding: 22px;
        text-align: center;
        color: var(--tx2);
        border: 1px dashed var(--bd);
        border-radius: var(--r);
        margin: 8px 0;
      }
      .alert {
        border-radius: var(--r);
        padding: 10px 14px;
        margin: 10px 0;
        font-size: 14px;
        background: var(--warn2);
        color: var(--warn);
      }
      .alert.info {
        background: var(--ac2);
        color: var(--ac);
      }
      .alert.ok {
        background: var(--ok2);
        color: var(--ok);
      }
      .alert.bad {
        background: var(--bad2);
        color: var(--bad);
      }
      .board {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(250px, 1fr);
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
      }
      .col h4 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--tx2);
      }
      .vc {
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: var(--sh);
      }
      .vc .t {
        font-weight: 600;
        cursor: pointer;
      }
      .vc .t:hover {
        color: var(--ac);
      }
      .stages {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .stg {
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        background: var(--bg);
        display: inline-flex;
        gap: 5px;
      }
      .stg.done {
        background: var(--ok2);
        color: var(--ok);
        border-color: transparent;
      }
      .stg.cur {
        border-color: var(--ac);
        color: var(--ac);
        font-weight: 600;
      }
      .tl {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 8px 2px;
      }
      .tl .ev {
        flex: none;
        width: 190px;
        border-top: 4px solid var(--bd);
        background: var(--bg2);
        padding: 8px 10px;
        border-radius: 0 0 var(--r) var(--r);
        font-size: 13px;
      }
      .ev.Failure,
      .ev.Conflict {
        border-top-color: var(--bad);
      }
      .ev.Breakthrough,
      .ev.Final-result {
        border-top-color: var(--ok);
      }
      .ev.Turning-point,
      .ev.Unexpected-discovery {
        border-top-color: var(--warn);
      }
      .ev.Progress {
        border-top-color: var(--ac);
      }
      .chk {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 3px 0;
        font-size: 14px;
      }
      .chk input {
        margin-top: 5px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tags label {
        font-weight: 400;
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 2px 10px;
        cursor: pointer;
        display: inline-flex;
        gap: 5px;
        align-items: center;
        font-size: 13px;
      }
      .thumb {
        max-width: 100%;
        max-height: 160px;
        border-radius: 6px;
        border: 1px solid var(--bd);
        margin-top: 6px;
      }
      .chain {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: stretch;
      }
      .chain > div {
        background: var(--bg2);
        border-radius: var(--r);
        padding: 8px 12px;
        font-size: 13px;
        flex: 1;
        min-width: 150px;
      }
      .chain b {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--tx2);
      }
      .chain .ar {
        flex: none;
        min-width: 0;
        background: none;
        align-self: center;
        color: var(--tx2);
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 16px;
      }
      .modal > div {
        background: var(--bg);
        border-radius: 12px;
        padding: 20px;
        max-width: 560px;
        width: 100%;
        max-height: 90vh;
        overflow: auto;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #222;
        color: #fff;
        padding: 9px 16px;
        border-radius: 8px;
        z-index: 200;
        font-size: 14px;
      }
      .hide-d {
        display: none;
      }
      .menu {
        display: none;
      }
      @media (max-width: 900px) {
        .g3,
        .g4,
        .g6 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .side {
          position: fixed;
          z-index: 60;
          left: 0;
          top: 0;
          margin-left: -270px;
          box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }
        .side.open {
          margin-left: 0;
        }
        .side.col {
          margin-left: -270px;
        }
        .side.col.open {
          margin-left: 0;
        }
        .menu {
          display: inline-flex;
        }
        main {
          padding: 16px 14px 80px;
        }
      }
      @media (max-width: 560px) {
        .g2,
        .g3,
        .g4,
        .g6 {
          grid-template-columns: 1fr;
        }
        .tabs {
          top: 53px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side" id="side" aria-label="Main navigation">
        <div class="brand">
          ▶ Creator OS<small
            >Personal YouTube strategy & storytelling lab</small
          >
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="note">
          Saved in this browser, with optional Notion sync for newly created
          plans. Use <b>Export</b> on the dashboard for backups.
        </div>
      </aside>
      <div class="mainwrap">
        <header class="top">
          <button class="btn menu" id="menuBtn" aria-label="Toggle sidebar">
            ☰
          </button>
          <div class="sr">
            <input
              type="search"
              id="gsearch"
              placeholder="Search videos and lessons…"
              aria-label="Search videos and lessons"
              autocomplete="off"
            />
            <div id="sres" role="listbox"></div>
          </div>
          <button class="btn" data-act="loadnotion">Load from Notion</button>
          <button class="btn pri" data-act="newvideo">+ New video</button>
          <button class="btn" id="themeBtn" aria-label="Toggle dark mode">
            ◐
          </button>
          <span id="saved" aria-live="polite"></span>
        </header>
        <main id="main"></main>
      </div>
    </div>

            if (!item.video || !item.pageId) continue;
            const existing = S.videos.find(
              (v) => v.notionPageId === item.pageId,
            );
            if (existing) {
              Object.assign(existing, item.video, {
                notionPageId: item.pageId,
                notionSync: true,

          for (const k of ["refs", "jr"])
            if (v[k] != null && !Array.isArray(v[k]))
              throw new Error(`${where} has an invalid ${k} list.`);
          for (const [parent, keys] of [
            ["scr", ["outline", "sections"]],
            ["prod", ["shots"]],
            ["an", ["snaps", "advice", "ret"]],
            ["next", ["fix", "keep", "test"]],
          ]) {
            if (
              v[parent] != null &&
              (typeof v[parent] !== "object" || Array.isArray(v[parent]))
            )
              throw new Error(`${where} has an invalid ${parent} section.`);
            if (v[parent])
              for (const k of keys)
                if (v[parent][k] != null && !Array.isArray(v[parent][k]))
                  throw new Error(
                    `${where} has an invalid ${parent}.${k} list.`,
                  );
          }
        }
        for (const k of [
          "lessons",
          "experiments",
          "learnings",
          "ideas",
          "promises",

            throw new Error(`The backup has an invalid ${k} list.`);

      function prepareImportedState(d) {

              an: { snaps: [], advice: [], ret: [], q: {}, dx: {} },
              next: { fix: [], keep: [], test: [] },
            },

          x.idn = Object.assign(
            { working: "", relation: "Standalone" },
            x.idn || {},

          x.goal = x.goal || {};
          x.prem = x.prem || {};
          x.refs = x.refs || [];
          x.insp = x.insp || {};

          x.scr.outline = x.scr.outline || [];
          x.scr.sections = x.scr.sections || [];
          x.jr = x.jr || [];
          x.mine = x.mine || {};
          x.prod = Object.assign({ checks: {}, shots: [] }, x.prod || {});

          x.an = Object.assign(

          x.next.keep = x.next.keep || [];
          x.next.test = x.next.test || [];
          if (!Array.isArray(x.stages)) x.stages = Array(15).fill(false);

      function render() {

        ).join("");
        $("#main").innerHTML = VIEWS[UI.view]
          ? VIEWS[UI.view]()
          : VIEWS.dashboard();
        const pt = $("#ptxt");
        if (pt) pt.value = get(pt.dataset.p) || "";
        calc();
        window.scrollTo(0, sy);
        if (aid) {
          const el = document.getElementById(aid);
          if (el) {
            el.focus({ preventScroll: true });
            try {
              el.setSelectionRange(ss, se);
            } catch (e) {}
          }
        }

          if (t.dataset.lines)
            val = val
              .split("\n")
              .map((x) => x.trim())
              .filter(Boolean);
          set(t.dataset.p, val);
          touch();
          if (t.dataset.r) render();
          else calc();
          return;
        }
        if (t.dataset.f) {
          F[t.dataset.f] = t.type === "checkbox" ? t.checked : t.value;
          render();
          return;

      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.dataset.actChange === "status") {
          const v = vById(t.dataset.id);
          v.status = t.value;
          touch();
          render();
          return;
        }
        if (t.dataset.tag) {
          const arr = get(t.dataset.path) || [];
          const i = arr.indexOf(t.dataset.tag);
          if (t.checked && i < 0) arr.push(t.dataset.tag);
          if (!t.checked && i >= 0) arr.splice(i, 1);
          set(t.dataset.path, arr);
          touch();
          return;
        }
        if (t.dataset.dash) {
          UI.dashVid = t.value;
          touch();
          render();
          return;
        }
        if (t.id === "lcat") {
          UI.lcat = t.value;
          render();
          return;
        }
        if (t.id === "jtag") {
          UI.jtag = t.value;
          render();
          return;
        }
        if (t.dataset.pv) {
          UI.pvid = t.value;
          render();
          return;
        }
        if (t.dataset.pk) {
          UI.pk = +t.value;
          render();
          return;
        }
        if (t.id === "impfile" && t.files[0]) {
          importAll(t.files[0]);
          t.value = "";
          return;
        }
        if (t.dataset.img && t.files[0]) {
          const f = t.files[0],
            img = new Image(),
            r = new FileReader();
          r.onload = () => {
            img.onload = () => {
              const c = document.createElement("canvas"),
                s = Math.min(1, 640 / img.width);
              c.width = img.width * s;
              c.height = img.height * s;
              c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
              set(t.dataset.img, c.toDataURL("image/jpeg", 0.8));
              touch();
              render();
            };
            img.src = r.result;
          };
          r.readAsDataURL(f);
        }
      });
